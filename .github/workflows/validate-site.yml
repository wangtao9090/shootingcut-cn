name: Validate site

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up current LTS Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils

      - name: Validate site structure and facts
        run: node scripts/validate-site.mjs

      - name: Run validator regression tests
        run: node --test scripts/validate-site.test.mjs

      - name: Validate sitemap XML
        run: xmllint --noout sitemap.xml
